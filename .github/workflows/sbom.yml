name: SBOM

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM
        run: python3 tools/make_sbom.py aee.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: aee-sbom-${{ github.ref_name }}
          path: aee.cdx.json
          if-no-files-found: error

