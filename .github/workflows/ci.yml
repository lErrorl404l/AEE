name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install numpy pillow SALib==1.6.0
          sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-core
      - name: Lint parity check
        run: python3 tools/validation/check_lint_parity.py
      - name: Validate SQF
        run: python3 tools/sqf_validator.py
      - name: Validate Config
        run: python3 tools/config_style_checker.py
      - name: Check Strings
        run: python3 tools/check_strings.py
      - name: Validate Stringtables
        run: python3 tools/stringtable_validator.py
      - name: Physics reference checks
        run: python3 tools/run_tests.py --fast
      - name: Atmospheric physics validation
        run: python3 tools/validation/validate_physics.py
      - name: Sensor physics validation
        run: python3 tools/validation/validate_sensors.py
      - name: Illuminance layer validation
        run: python3 tools/validation/validate_illuminance.py
      - name: DoF focus validation
        run: python3 tools/validation/validate_dof.py
      - name: Astronomical validation
        run: python3 tools/validation/validate_astronomical.py
      - name: CBA settings cross-reference validation
        run: python3 tools/validation/validate_cba_settings.py
      - name: Biome classifier agreement validation
        run: python3 tools/validation/validate_biome_plausible.py --self-check
      - name: No-op current-unit guard check
        run: python3 tools/validation/fix_current_unit_guard.py
      - name: Cross-module reference validation
        run: python3 tools/validation/validate_cross_module.py
      - name: Macro quoting check
        run: python3 tools/validation/check_macro_quoting.py
      - name: Oracle validation (JSP 939 VV&A)
        run: python3 tools/validation/validate_oracles.py
      - name: Physics config-binding validation
        run: python3 tools/validation/validate_physics_config.py
      - name: Physics config override freshness check
        run: python3 tools/validation/gen_physics_config.py --check
      - name: Star catalogue freshness check
        run: python3 tools/validation/gen_star_catalog.py --check
      - name: Meteor shower data freshness check
        run: python3 tools/validation/gen_meteor_showers.py --check
      - name: Vehicle class inventory check
        run: python3 tools/validation/gen_vehicle_class_inventory.py --check
      - name: Vehicle projection freshness check
        run: python3 tools/validation/gen_vehicle_data.py --check
      - name: Vehicle coverage freshness check
        run: python3 tools/validation/gen_vehicle_coverage.py --check
      - name: Vehicle data validation
        run: python3 tools/validation/validate_vehicle_data.py
      - name: Ballistics data validation
        run: python3 tools/validation/validate_ballistics_data.py
      - name: Vehicle mass model freshness check
        run: python3 tools/validation/gen_vehicle_mass_model.py --check
      - name: Vehicle mass model calibration gate
        run: python3 tools/validation/validate_vehicle_mass_model.py
      - name: Engine mass calibration validation
        run: python3 tools/validation/validate_mass_calibration.py
      - name: Aircraft projection freshness check
        run: python3 tools/validation/gen_aircraft_data.py --check
      - name: Aircraft coverage freshness check
        run: python3 tools/validation/gen_aircraft_coverage.py --check
      - name: Aircraft systems freshness check
        run: python3 tools/validation/gen_aircraft_systems.py --check
      - name: Aircraft data validation
        run: python3 tools/validation/validate_aircraft_data.py
      - name: Aircraft systems validation
        run: python3 -m unittest tools.tests.test_aircraft_systems
      - name: Thermal optics config freshness check
        run: python3 tools/validation/gen_thermal_optics.py --check
      - name: Engine override freshness check
        run: python3 tools/validation/gen_engine_overrides.py --check
      - name: Engine override register and header validation
        run: python3 tools/validation/validate_engine_overrides.py
      - name: Debug index freshness check
        run: python3 tools/validation/gen_debug_index.py --check
      - name: MGRS table freshness check
        run: python3 tools/validation/gen_mgrs_tables.py --check
      - name: MGRS table and anchor validation
        run: python3 tools/validation/validate_mgrs.py
      - name: Symbology table freshness check
        run: python3 tools/validation/gen_symbology_tables.py --check
      - name: Symbology table and kernel validation
        run: python3 tools/validation/validate_symbology.py
      - name: Symbology marker colour validation
        run: python3 tools/validation/validate_symbology_colour.py
      - name: Symbology catalogue texture freshness check
        run: python3 tools/gen_symbology_catalogue.py --check
      - name: Symbology catalogue SVG provenance check
        run: python3 tools/gen_symbology_catalogue.py --verify-svg
      - name: Symbology catalogue provenance validation
        run: python3 tools/validation/validate_symbology_catalogue.py
      - name: Terrain table freshness check
        run: python3 tools/validation/gen_terrain_tables.py --check
      - name: Terrain table and registry validation
        run: python3 tools/validation/validate_terrain.py
      - name: Terrain symbol texture freshness check
        run: python3 tools/gen_terrain_symbols.py --check
      - name: Terrain symbol texture and provenance validation
        run: python3 tools/validation/validate_terrain_symbols.py
      - name: Terrain symbol alpha validation
        run: python3 tools/validation/validate_terrain_alpha.py
      - name: Terrain symbol provenance validation
        run: python3 tools/validation/validate_terrain_provenance.py
      - name: Terrain catalogue freshness check
        run: python3 tools/gen_terrain_catalogue.py --check
      - name: APP-6 catalogue freshness check
        run: python3 tools/gen_app6_catalogue.py --check
      - name: Compat direction split freshness check
        run: python3 tools/gen_compat_directions.py --check
      - name: Ownership sentinel freshness check
        run: python3 tools/gen_ownership_sentinels.py --check
      - name: Extension contract freshness check
        run: python3 tools/gen_extension_contract.py --check
      - name: Dev console contract freshness check
        run: python3 tools/gen_dev_console_contract.py --check
      - name: Kernel table freshness check
        run: python3 tools/gen_kernel_table.py --check
      - name: diag_deltaTime scan
        run: python3 tools/tests/test_sim_clock_guard.py
      - name: Kernel-split scan
        run: python3 tools/tests/test_kernel_split.py
      - name: Wildlife ecology projection freshness check
        run: python3 tools/validation/gen_wildlife_ecology.py --check
      - name: Wildlife ecology corpus validation
        run: python3 tools/validation/validate_wildlife_ecology.py
      - name: Test-suite registration check
        run: python3 tools/tests/test_suite_registration.py
      - name: ADR number check
        run: python3 tools/tests/test_adr_numbers.py
      - name: Engine reference doc check
        run: python3 tools/tests/test_engine_docs.py
      - name: Check for BOM
        uses: arma-actions/bom-check@v1
        with:
          path: addons

  extension:
    # The native extension, gated without the network: the GitHub runner image
    # carries a stable Rust toolchain, so no toolchain download is needed. Only
    # the public crates registry is reached, exactly as the validate job reaches
    # PyPI. No gate here touches a live engine or an external service.
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/dev-harness/extension/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/dev-harness/extension/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Extension unit and parity tests
        run: cargo test --locked --manifest-path tools/dev-harness/extension/Cargo.toml
      - name: Extension release build (Linux width)
        run: cargo build --release --locked --manifest-path tools/dev-harness/extension/Cargo.toml
      # The Windows width is a recorded step, not a push gate: it needs the MSVC
      # CRT/SDK via cargo-xwin, a network download, so it runs on a workstation
      # with `bash tools/dev-harness/extension/build.sh windows`.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Cache HEMTT
        uses: actions/cache@v6
        with:
          path: ~/.hemtt/cache
          key: hemtt-${{ hashFiles('.hemtt/**/*') }}
          restore-keys: hemtt-
      - name: Run HEMTT check
        run: tools/hemtt.sh check -p -e
      - name: Run HEMTT build
        run: tools/hemtt.sh build
      - name: Build release artefact
        run: tools/hemtt.sh release
      - name: Release-artefact proof
        # The release tree carries no dev PBO and no dev binary (ADR-035). This
        # runs `hemtt release` first, so it is a CI/phase gate and not part of
        # the per-commit `run_tests.py --fast` set.
        env:
          AEE_RELEASE_TREE: .hemttout/release
          AEE_REQUIRE_RELEASE_TREE: "1"
        run: python3 -m unittest tools.tests.test_dev_harness_release_exclusion -v
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aee
          path: .hemttout/build

  release:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Cache HEMTT
        uses: actions/cache@v6
        with:
          path: ~/.hemtt/cache
          key: hemtt-${{ hashFiles('.hemtt/**/*') }}
          restore-keys: hemtt-
      - name: Build signed release
        run: tools/hemtt.sh release
      - name: Generate SBOM
        run: python3 tools/make_sbom.py sbom.cdx.json
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            releases/*
            sbom.cdx.json