name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate SQF
        run: python3 tools/sqf_validator.py
      - name: Validate Config
        run: python3 tools/config_style_checker.py
      - name: Check Strings
        run: python3 tools/check_strings.py
      - name: Validate Stringtables
        run: python3 tools/stringtable_validator.py
      - name: Physics reference checks
        run: python3 tools/run_tests.py --fast
      - name: Sensor physics validation
        run: python3 tools/validation/validate_sensors.py
      - name: Illuminance layer validation
        run: python3 tools/validation/validate_illuminance.py
      - name: DoF focus validation
        run: python3 tools/validation/validate_dof.py
      - name: Astronomical validation
        run: python3 tools/validation/validate_astronomical.py
      - name: Check for BOM
        uses: arma-actions/bom-check@v1
        with:
          path: addons

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Cache HEMTT
        uses: actions/cache@v6
        with:
          path: ~/.hemtt/cache
          key: hemtt-${{ hashFiles('.hemtt/**/*') }}
          restore-keys: hemtt-
      - name: Run HEMTT check
        run: hemtt check -p -e
      - name: Run HEMTT build
        run: hemtt build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aee
          path: .hemttout/build

  release:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Cache HEMTT
        uses: actions/cache@v6
        with:
          path: ~/.hemtt/cache
          key: hemtt-${{ hashFiles('.hemtt/**/*') }}
          restore-keys: hemtt-
      - name: Build signed release
        run: hemtt release
      - name: Generate SBOM
        run: python3 tools/make_sbom.py sbom.cdx.json
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            releases/*
            sbom.cdx.json