name: Docker Test

# On-demand only: the harness mounts a provisioned Arma 3 server install
# (see tools/docker_test.sh). Provisioning the server on a fresh runner is
# a ~10 GB steamcmd download, so this runs manually or via API dispatch
# rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: arma-actions/hemtt@v1
      - name: Headless dedicated-server test
        run: tools/docker_test.sh
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aee-docker-log
          path: tests/docker/run.log
