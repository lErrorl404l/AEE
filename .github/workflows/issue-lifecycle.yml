name: Issue Lifecycle
on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  # ─── Close linked issues when PR merges ────────────────────────────────
  # Matches "fixes #N", "closes #N", "resolves #N" in PR body.
  # Uses GITHUB_TOKEN — no PAT required.
  close-linked:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const nums = new Set();
            for (const m of body.matchAll(/(?:fixes|closes|resolves)\s*#(\d+)/gi)) {
              nums.add(parseInt(m[1]));
            }
            for (const n of nums) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: n, state: 'closed', state_reason: 'completed',
                });
                console.log(`Closed #${n}`);
              } catch (e) { console.log(`Failed #${n}: ${e.message}`); }
            }
            if (nums.size === 0) console.log('No linked issues in PR body');
