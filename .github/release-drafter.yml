# Release Drafter config — auto-generates release notes
# https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'type/feat'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'type/bug'
  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'docs'
      - 'type/docs'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'ci'
      - 'ops'
      - 'type/chore'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - 'major'
      - 'type/major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
      - 'type/feat'
  patch:
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'documentation'
      - 'chore'
      - 'refactor'
      - 'ci'
      - 'ops'
      - 'type/bug'
      - 'type/docs'
      - 'type/chore'
  default: patch
