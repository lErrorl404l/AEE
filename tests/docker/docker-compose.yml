services:
  aee-test:
    image: ghcr.io/brettmayson/arma3server/arma3server:v3
    platform: linux/amd64
    network_mode: host
    environment:
      - ARMA3_CONFIG_FILE=/arma3/config.toml
      - ARMA3_SERVER__SKIP_INSTALL=true
      - ARMA3_SERVER__CONFIG=server.cfg
      # Per-run profile and port.  Two concurrent runs get a unique compose
      # project (COMPOSE_PROJECT_NAME) and a unique port block, so they never
      # share a container or a socket.  The defaults keep the historical run.
      - ARMA3_SERVER__PROFILE=${AEE_PROFILE:-aeetest}
      - ARMA3_SERVER__PORT=${AEE_GAME_PORT:-2302}
      - ARMA3_SERVER__PARAMS=-autoInit -noBattlEye -mod=mods/@aee;mods/@cba_a3
      - ARMA3_HEADLESS__CLIENTS=0
      - ARMA3_MODS__LOCAL=false
    entrypoint: ["/bin/sh", "/arma3/entrypoint.sh"]
    tmpfs:
      # server writes its profile state here; keep root-owned files out of the repo
      - /arma3/server/configs/profiles
    volumes:
      - ./config.toml:/arma3/config.toml
      - ./entrypoint.sh:/arma3/entrypoint.sh
      # The server.cfg directory is per run, so a concurrent run cannot
      # overwrite this run's mission list.  Defaults preserve the old layout.
      - ${AEE_CONFIGS_DIR:-./configs}:/arma3/server/configs
      - ./mods:/arma3/server/mods
      - ./missions:/arma3/server/mpmissions
      - ${ARMA3_SERVER_ROOT:-./server}:/arma3/server
    restart: "no"
