name = "ACE Environment Extended"
prefix = "aee"
author = "lErrorl404l"
mainprefix = "z"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "README.md",
    "LICENSE",
    "logo_aee_ca.paa",
]

[properties]
author = "lErrorl404l"
url = "https://github.com/lErrorl404l/AEE"

[version]
path = "addons/main/script_version.hpp"
# 0 = version purely from script_version.hpp, bumped at release time
# (matches ACE3/ACRE2 practice). 8 = git-hash suffix instead.
git_hash = 0

[signing]
# Ephemeral per-release signing (hemtt release generates a throwaway key).
# No private key file, no private_key_hash - same model as A3SQL.
# A stable bikey is only needed if a server whitelists the mod by key.
authority = "aee"

[hemtt.publish]
description = ".hemtt/workshop.md"
changelog = ".hemtt/changelog.md"

[hemtt.release]
folder = "aee"
sign = true
archive = true

[hemtt.dev]
exclude = ["test"]

[hemtt.launch.default]
workshop = ["450814997"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.ace3]
workshop = ["450814997", "773131200"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.acre2]
workshop = ["450814997", "1485211835"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.tfar]
workshop = ["450814997", "894678801"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.kat]
# KAT - Advanced Medical host (2020940806) added for compat testing.
workshop = ["450814997", "773131200", "2020940806"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.acm]
# ACM host workshop ID pending verification; AEE not yet published.
workshop = ["450814997", "773131200"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.full]
workshop = ["450814997", "773131200", "894678801", "1485211835", "2020940806"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]
