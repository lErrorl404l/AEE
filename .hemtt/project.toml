name = "Advanced Environment Extension"
prefix = "aee"
author = "lErrorl404l"
mainprefix = "z"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "README.md",
    "LICENSE",
]

[properties]
author = "lErrorl404l"
url = "https://github.com/aee-mod/aee"

[version]
path = "addons/main/script_version.hpp"
# 0 = version purely from script_version.hpp, bumped at release time
# (matches ACE3/ACRE2 practice). 8 = git-hash suffix instead.
git_hash = 0

[signing]
# Stable-key flow: hemtt keys generate (run locally, interactive password).
# Do NOT commit private_key_hash - HEMTT hard-fails encrypted keys in CI.
authority = "aee"

[hemtt.release]
folder = "@aee"
sign = true
archive = true

[hemtt.dev]
exclude = ["test"]

[hemtt.launch.default]
workshop = ["450814997"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.ace3]
workshop = ["450814997", "773131200"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.acre2]
workshop = ["450814997", "1485211835"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.tfar]
workshop = ["450814997", "894678801"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.kat]
workshop = ["450814997", "773131200"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.acm]
workshop = ["450814997", "773131200"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]

[hemtt.launch.full]
workshop = ["450814997", "773131200", "894678801", "1485211835"]
parameters = ["-skipIntro", "-noSplash", "-showScriptErrors", "-filePatching"]
