[config.c11_file_type]
options.allow_no_extension = true

[config.c15_cfgpatches_scope]
enabled = true

[stringtables.l02_usage]
options.ignore_unused = true

[sqf.banned_commands]
options.ignore = [
    "addPublicVariableEventHandler",
    # simulSetHumidity: the wiki lists it under Broken Commands, but the same
    # page records it as implemented since Arma 3 2.18.  It is used behind the
    # simul-weather opt-in (fnc_updateSimulWeather).
    "simulSetHumidity",
]

[sqf.s28_banned_macros]
options.release = [
    "DEBUG_MODE_FULL",
    "DISABLE_COMPILE_CACHE",
    "ENABLE_PERFORMANCE_COUNTERS",
]

[sqf.s13_undefined]
enabled = true
options.check_orphan_code = true

[sqf.s15_shadowed]
enabled = true

[sqf.s16_not_private]
enabled = true

[sqf.s17_var_all_caps]
options.ignore = [
    "SLX_*",
    "AEE_*",
]
