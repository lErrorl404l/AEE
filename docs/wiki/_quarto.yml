project:
  type: website

website:
  title: "AEE"
  favicon: images/favicon.png
  search: true
  page-navigation: true
  announcement:
    icon: info-circle
    dismissable: true
    content: "AEE 1.0.0 — physically accurate environment simulation for Arma 3"
    type: primary
  page-footer:
    left: "Advanced Environment Extension - GPL-2.0-or-later"
    right: "Version 1.0.0"
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Overview
      - section: "Chapters"
        contents:
          - text: About
            href: chapters/introduction.qmd
          - text: Modules
            href: chapters/modules.qmd
          - text: State variables
            href: chapters/state-variables.qmd
          - text: Physics
            href: chapters/physics.qmd
          - text: Development
            href: chapters/development.qmd
          - text: Testing
            href: chapters/testing.qmd
      - section: "Annexes"
        contents:
          - text: Formulas
            href: annexes/annex-a-formulas.qmd
          - text: Compatibility
            href: annexes/annex-b-compat.qmd
          - text: Variable reference
            href: annexes/annex-c-variable-reference.qmd
      - text: Support
        href: support.qmd
  navbar:
    right:
      - icon: github
        href: https://github.com/lErrorl404l/AEE
        aria-label: GitHub
  twitter-card:
    image: images/social-preview.png
  open-graph:
    image: images/social-preview.png

format:
  html:
    theme:
      - cosmo
      - custom.scss
    filters:
      - auto-dark
    breadcrumbs: true
    highlight-style: github
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
    # MathJax: number \begin{equation} / \begin{align} environments
    # automatically (default tags is 'none').
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              tags: 'ams'
            }
          };
          </script>

crossref:
  eq-prefix: "Eq."
  eq-title: "Equation"
  thm-prefix: "Thm."
  def-prefix: "Def."
  exm-prefix: "Ex."
  labels: arabic
