project:
  type: website

website:
  title: "AEE Documentation"
  favicon: images/favicon.png
  site-url: https://lerrorl404l.github.io/AEE/
  repo-url: https://github.com/lErrorl404l/AEE
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  announcement:
    icon: info-circle
    dismissable: true
    content: "AEE 1.0.0 — physically accurate environment simulation for Arma 3"
    type: primary
  page-footer:
    left: "Advanced Environment Extension - GPL-2.0-or-later"
    right: "Version 1.0.0"
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Overview
      - section: "Chapters"
        contents:
          - text: About
            href: chapters/introduction.qmd
          - text: Getting Started
            href: chapters/getting-started.qmd
          - text: Modules
            href: chapters/modules.qmd
          - text: State variables
            href: chapters/state-variables.qmd
          - text: Configuration
            href: chapters/configuration.qmd
          - text: Physics
            href: chapters/physics.qmd
          - text: Integrations
            href: chapters/integrations.qmd
          - text: Development
            href: chapters/development.qmd
          - text: Testing
            href: chapters/testing.qmd
          - text: Dev console and workbench
            href: chapters/dev-console.qmd
          - text: Operator guide
            href: chapters/operator-guide.qmd
          - text: Aircraft systems
            href: chapters/aircraft-systems.qmd
      - section: "Annexes"
        contents:
          - text: Formulas
            href: annexes/annex-a-formulas.qmd
          - text: Compatibility
            href: annexes/annex-b-compat.qmd
          - text: Variable reference
            href: annexes/annex-c-variable-reference.qmd
      - section: "Research"
        contents:
          - text: CBRN agent plume dispersion
            href: research/cbrn-plume-dispersion.md
      - section: "Field guide"
        contents:
          - text: "How to read"
            href: field-guide/index.qmd
          - text: "Predictability ceiling"
            href: field-guide/ceiling.qmd
          - text: "F1 - Config re-declare"
            href: field-guide/features/config-redeclare.qmd
          - text: "F2 - The map surface"
            href: field-guide/features/map-surface.qmd
          - text: "F3 - HUD, markers and symbology"
            href: field-guide/features/hud-markers.qmd
          - text: "F4 - Thermal imaging and AGC"
            href: field-guide/features/thermal-agc.qmd
          - text: "Citations"
            href: field-guide/citations.qmd
      - text: Support
        href: support.qmd
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "About"
        href: chapters/introduction.qmd
      - text: "Getting Started"
        href: chapters/getting-started.qmd
      - text: "Modules"
        href: chapters/modules.qmd
      - text: "Physics"
        href: chapters/physics.qmd
      - text: "Development"
        href: chapters/development.qmd
    right:
      - icon: github
        href: https://github.com/lErrorl404l/AEE
        aria-label: GitHub
  twitter-card:
    image: images/social-preview.png
  open-graph:
    image: images/social-preview.png

format:
  html:
    theme:
      - cosmo
      - custom.scss
    filters:
      - auto-dark
    breadcrumbs: true
    highlight-style: github
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
    # MathJax: number \begin{equation} / \begin{align} environments
    # automatically (default tags is 'none').
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              tags: 'ams'
            }
          };
          </script>

crossref:
  eq-prefix: "Eq."
  eq-title: "Equation"
  thm-prefix: "Thm."
  def-prefix: "Def."
  exm-prefix: "Ex."
  labels: arabic
